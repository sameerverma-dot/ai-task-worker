# Each task: what the agent is told, how the world is set up first, and the expected end state.
# The agent never sees "expect"; run_eval.py checks it directly in the SQLite database.
#
# setup.seed:   invoices already in the app before the run  [vendor, number, amount, due_date, status]
# setup.faults: failure switches to turn on
# setup.human_answers: scripted replies to ask_human, in order
# setup.approve: what request_approval answers (default true)
# expect.rows:  invoices that must exist exactly once, with these values
# expect.row_count: total number of invoices in the app afterwards
# expect.asked_human / answer_contains / success: checks on the agent's behaviour and final report

- id: 1
  name: main Globex task
  task: Find the latest invoice from Globex, extract the amount and due date, enter it into our accounts system, and tell me once it's done.
  expect: {rows: [{number: GLX-1032, vendor: Globex, amount: 78250, due_date: "2026-10-20"}], row_count: 1, success: true}

- id: 2
  name: all unpaid Initech
  task: Enter all unpaid Initech invoices into our accounts system.
  expect:
    rows: [{number: INI-517, amount: 18750, due_date: "2026-10-03"}, {number: INI-522, amount: 24300, due_date: "2026-10-15"}]
    row_count: 2
    success: true

- id: 3
  name: mark Umbrella paid
  task: Mark the Umbrella Corp invoice UMB-2201 as paid in our accounts system.
  setup: {seed: [[Umbrella Corp, UMB-2201, 91000, "2026-10-10", Unpaid]]}
  expect: {rows: [{number: UMB-2201, status: Paid}], row_count: 1, success: true}

- id: 4
  name: ambiguous Acme
  task: Enter the Acme invoice into our accounts system.
  setup: {human_answers: ["Acme Supply Co, the chairs invoice"]}
  expect: {rows: [{number: ASC-3090, amount: 27900, due_date: "2026-10-08"}], row_count: 1, asked_human: true, success: true}

- id: 5
  name: main + FAIL_FIRST_SUBMIT
  task: Find the latest invoice from Globex, extract the amount and due date, enter it into our accounts system, and tell me once it's done.
  setup: {faults: [FAIL_FIRST_SUBMIT], video: true}   # this run is also the demo video
  expect: {rows: [{number: GLX-1032, amount: 78250, due_date: "2026-10-20"}], row_count: 1, success: true}

- id: 6
  name: main + RENAME_FIELD + SLOW_PAGE
  task: Find the latest invoice from Globex, extract the amount and due date, enter it into our accounts system, and tell me once it's done.
  setup: {faults: [RENAME_FIELD, SLOW_PAGE]}
  expect: {rows: [{number: GLX-1032, amount: 78250, due_date: "2026-10-20"}], row_count: 1, success: true}

- id: 7
  name: already entered (duplicate)
  task: Find the latest invoice from Globex, extract the amount and due date, enter it into our accounts system, and tell me once it's done.
  setup: {seed: [[Globex, GLX-1032, 78250, "2026-10-20", Unpaid]]}
  expect: {rows: [{number: GLX-1032}], row_count: 1, answer_contains: [already]}

- id: 8
  name: read-only question
  task: Looking at the invoices in the inbox, which vendor has the highest total amount still due (unpaid invoices)? Do not change anything.
  expect: {row_count: 0, answer_contains: [Globex]}

- id: 9
  name: impossible task (email)
  task: Email Globex and ask them to send a corrected copy of invoice GLX-1017.
  expect: {row_count: 0, success: false}

- id: 10
  name: approval denied
  task: Find the latest invoice from Globex, extract the amount and due date, enter it into our accounts system, and tell me once it's done.
  setup: {approve: false}
  expect: {row_count: 0, success: false}
